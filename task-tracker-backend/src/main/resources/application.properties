# ===== APPLICATION =====
spring.application.name=task-tracker-backend
server.port=8080

# ===== DATABASE CONFIG =====
# These will be OVERRIDDEN by docker-compose environment variables
# Keep these for local development without Docker
spring.datasource.url=jdbc:mysql://localhost:3306/tasktracker?useSSL=false
spring.datasource.username=root
spring.datasource.password=root

# ===== JPA/HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== SECURITY =====
spring.security.user.name=admin
spring.security.user.password=adminpass
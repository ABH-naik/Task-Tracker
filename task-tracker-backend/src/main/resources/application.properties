spring.application.name=task-tracker-backend
# ===== DATABASE CONFIG =====
spring.datasource.url=jdbc:mysql://localhost:3306/tasktracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# ===== JPA/HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== PERFORMANCE =====
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT Dummy Configuration (for local testing)
jwt.secret=dummy-secret-1234567890abcdefghijklmnopqrstuvwx
jwt.expiration=3600


# ===== VALIDATION =====
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ===== SSL (Uncomment for production) =====
# spring.datasource.url=jdbc:mysql://localhost:3306/tasktracker?useSSL=true&requireSSL=true&verifyServerCertificate=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Optional: if you are customizing the claim for roles
# This requires handling in SecurityConfig to extract 'roles' from the JWT
# There's no native 'claims.roles' setting in properties
spring.main.allow-bean-definition-overriding=true




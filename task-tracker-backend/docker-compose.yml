version: "3.8"

services:
  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tasktracker
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    command: >
      --bind-address=0.0.0.0 
      --skip-name-resolve 
      --max-connections=200
      --connect-timeout=60
      --wait-timeout=28800
      --interactive-timeout=28800
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=256M

  backend:
    build: .
    container_name: spring_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: 13.233.124.153
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db_data:

